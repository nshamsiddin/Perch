name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the DMG
        run: |
          chmod +x bundle.sh dmg.sh
          ./dmg.sh

      - name: Name the artifact after the tag
        run: mv Perch.dmg "Perch-${GITHUB_REF_NAME}.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "Perch-${GITHUB_REF_NAME}.dmg" \
            --title "Perch ${GITHUB_REF_NAME}" \
            --generate-notes
